<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sales Tracker</title>
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
  </head>
  <body class="bg-light">
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
      <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow-sm border-0 mx-auto" style="max-width: 24rem;">
            <div class="card-body p-3 p-sm-4">
              <h1 class="h4 text-center mb-3">Login Sales Tracker</h1>
              <div id="login-error" class="alert alert-danger d-none" role="alert">
                Nama atau password salah. Silakan coba lagi.
              </div>
              <form action="login.php" method="post">
                <div class="mb-3">
                  <label for="nama" class="form-label">Nama</label>
                  <input type="text" class="form-control" id="nama" name="nama" required autocomplete="username">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <div class="d-grid gap-2">
                  <button class="btn btn-primary" type="submit">Login</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      if (new URLSearchParams(window.location.search).has("error")) {
        document.getElementById("login-error").classList.remove("d-none");
      }
    </script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
